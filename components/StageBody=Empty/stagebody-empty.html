<!-- StageBody=Empty - all variants, generated from Figma. -->
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../base.css">
<link rel="stylesheet" href="./stagebody-empty.css">
<link rel="stylesheet" href="../EmptyState/emptystate.css">
<link rel="stylesheet" href="../Icons/icons.css">

<!-- StageBody=Empty -->
<section class="oc-stagebody-empty">
  <!-- instance of EmptyState (State=Default, Density=Default) - styling lives in components/EmptyState/ -->
  <div class="oc-stagebody-empty__emptystate">
    <section class="oc-emptystate">
      <!-- instance of EmptyArt (EmptyArt) - styling lives in components/EmptyArt/ -->
      <div class="oc-emptystate__emptyart">
        <div class="oc-emptyart">
          <div class="oc-emptyart__doc1"></div>
          <div class="oc-emptyart__doc2"></div>
          <div class="oc-emptyart__cursor">
            <span class="oc-emptyart__vector"></span>
            <span class="oc-emptyart__vector-2"></span>
            <span class="oc-emptyart__vector-3"></span>
            <span class="oc-emptyart__vector-4"></span>
            <span class="oc-emptyart__vector-5"></span>
          </div>
        </div>
      </div>
      <!-- instance of EmptyTitle (EmptyTitle) - styling lives in components/EmptyTitle/ -->
      <div class="oc-emptystate__emptytitle">
        <p class="oc-emptytitle">
          <span class="oc-emptytitle__label">Brak pojazdów na tym etapie</span>
        </p>
      </div>
      <!-- instance of EmptySub (EmptySub) - styling lives in components/EmptySub/ -->
      <div class="oc-emptystate__emptysub">
        <p class="oc-emptysub">
          <span class="oc-emptysub__label">Przytrzymaj kartę lewym przyciskiem myszy i upuść ją tutaj.</span>
        </p>
      </div>
    </section>
  </div>
</section>
